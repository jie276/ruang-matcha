<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抹茶网页 · 设计预览</title><link rel="icon" href="assets/leaf.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#e7eadf;color:#304a31;font-family:Arial,'Microsoft YaHei',sans-serif}.toolbar{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 30px;border-bottom:1px solid #cdd3c0;background:#f7f5ed}.title{display:flex;gap:12px;align-items:center}.title img{width:28px;height:32px}.title strong{font-size:14px;font-weight:500}.title small{display:block;font-size:10px;color:#78816c;margin-top:5px}.devices{display:flex;gap:5px;background:#e8ecdf;padding:5px;border-radius:7px}button{font:inherit;color:inherit;cursor:pointer;background:transparent;border:0;padding:9px 18px;font-size:12px;border-radius:4px}button[aria-pressed=true]{background:#304a31;color:#fff}.open{font-size:11px;color:#304a31;text-decoration:none;border-bottom:1px solid #a4b092;padding-bottom:4px}.stage{height:calc(100dvh - 110px);padding:18px;display:flex;align-items:center;justify-content:center}.frame{width:100%;height:100%;background:#f7f5ed;box-shadow:0 8px 35px #304a3112;overflow:hidden;border:1px solid #b9c3ab;transition:border-radius .25s}.frame[data-mode=tablet]{width:797px;border:7px solid #304a31;border-radius:17px}.frame[data-mode=mobile]{width:419px;border:7px solid #304a31;border-radius:23px}iframe{display:block;width:100%;height:100%;border:0}.note{height:34px;display:flex;justify-content:center;align-items:center;font-size:10px;letter-spacing:.01em;color:#748164}button:focus-visible,a:focus-visible{outline:2px solid #7b8e5b;outline-offset:3px}@media(max-width:650px){.toolbar{height:110px;padding:14px 16px;flex-wrap:wrap;gap:12px}.title strong{font-size:12px}.title small{font-size:9px}.devices{order:3;margin:auto;padding:3px}.devices button{padding:7px 19px;font-size:11px}.open{font-size:10px}.stage{height:calc(100dvh - 148px);padding:12px 8px}.note{height:38px;font-size:9px;text-align:center;padding-inline:15px}.frame[data-mode=mobile]{max-width:100%}}
</style></head><body><header class="toolbar"><div class="title"><img src="assets/leaf.svg" alt=""><div><strong>Ruang Matcha · 网页设计初稿</strong><small>切换设备尺寸，向下滚动查看两个商品</small></div></div><div class="devices" role="group" aria-label="预览设备"><button data-mode="desktop" aria-pressed="true">电脑</button><button data-mode="tablet" aria-pressed="false">平板</button><button data-mode="mobile" aria-pressed="false">手机</button></div><a class="open" href="./" target="_blank" rel="noopener">单独打开网页 ↗</a></header><main class="stage"><div class="frame" data-mode="desktop"><iframe src="./" title="抹茶商品展示网页"></iframe></div></main><p class="note">临时店名：Ruang Matcha　·　价格与真实 TikTok 链接待补充</p><script>document.querySelectorAll('button[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.frame').dataset.mode=button.dataset.mode;document.querySelectorAll('button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));</script></body>
</html>
